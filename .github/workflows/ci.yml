name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package, tests, docs, and GRIB2
        run: python -m pip install -e ".[dev,docs,grib]"
      - name: Unit tests
        run: python -m pytest
      - name: Sphinx HTML
        run: make -C docs html
